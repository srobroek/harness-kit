name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      # Self-check: pack the tarball, install it with npm ci and with bun install, run the CLI from each.
      - run: npm run pack-check
