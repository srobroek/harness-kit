# Reusable: multi-semantic-release with the GitHub plugin. The caller's release config names the plugin.
#   jobs:
#     release:
#       uses: srobroek/harness-kit/.github/workflows/release.yml@v1.0.0   # same version as the package pin
#       permissions: { contents: write, issues: write, pull-requests: write }
name: release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      bun-version:
        type: string
        default: "1.4.5"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bunx multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
